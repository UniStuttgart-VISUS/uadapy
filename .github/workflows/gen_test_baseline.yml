name: Generate Test Baseline Images

on: 
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch on which to generate and push'
        required: true
        default: 'main'
        type: string
      


jobs:
  genbaseline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.branch }}
        # Value already defaults to true, but `persist-credentials` is required to push new commits to the repository.
        persist-credentials: true

    - name: Set Up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.test.txt
        pip install pytest pytest-mpl

    - name: Print CPU and BLAS diagnostics
      run: |
        echo "===== CPU INFO ====="
        lscpu
        echo "===== /proc/cpuinfo model/flags ====="
        grep -m1 "model name" /proc/cpuinfo
        grep -m1 "flags" /proc/cpuinfo | tr ' ' '\n' | grep -E "avx|fma|sse" | sort -u
        echo "===== numpy config ====="
        python -c "import numpy; numpy.show_config()"
        echo "===== scipy config ====="
        python -c "import scipy; scipy.show_config()"
        echo "===== BLAS/LAPACK library resolved by numpy ====="
        python -c "import numpy as np; np.show_runtime()" || true

    - name: Run Pytest baseline generation
      run: pytest --mpl-generate-path=tests/baseline

    - name: Commit baseline images
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "Update baseline images [via github action]"
        file_pattern: "tests/baseline/*.png"
