name: Generate Test Baseline Images

on: 
  workflow_dispatch:


jobs:
  genbaseline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.test.txt
        pip install pytest pytest-mpl

    - name: Run Pytest baseline generation
      run: pytest --mpl-generate-path=tests/baseline

    - name: Commit baseline images
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update baseline images [via github action]"
          file_pattern: "tests/baseline/*.png"
