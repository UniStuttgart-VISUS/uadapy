name: Run Pytest on Push

on:  
  push:  
    branches: [ main ]
  pull_request:  
    branches: [ main ]
  workflow_dispatch:
    # manual trigger

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.test.txt
        pip install pytest pytest-mpl

    - name: Print CPU and BLAS diagnostics
      run: |
        echo "===== CPU INFO ====="
        lscpu
        echo "===== /proc/cpuinfo model/flags ====="
        grep -m1 "model name" /proc/cpuinfo
        grep -m1 "flags" /proc/cpuinfo | tr ' ' '\n' | grep -E "avx|fma|sse" | sort -u
        echo "===== numpy config ====="
        python -c "import numpy; numpy.show_config()"
        echo "===== scipy config ====="
        python -c "import scipy; scipy.show_config()"
        echo "===== BLAS/LAPACK library resolved by numpy ====="
        python -c "import numpy as np; np.show_runtime()" || true

    - name: Run Pytest
      run: pytest --mpl --mpl-results-path=pytest-mpl-results --mpl-generate-summary=html

    - name: Upload Matplotlib Test Failure Artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: matplotlib-test-failures
        path: pytest-mpl-results/
