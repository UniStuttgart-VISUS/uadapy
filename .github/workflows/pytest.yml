name: Run Pytest on Push

on:  
  push:  
    branches: [ main ]
  pull_request:  
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.test.txt
        pip install pytest pytest-mpl

    - name: Run Pytest
      run: pytest --mpl --mpl-results-path=pytest-mpl-results --mpl-generate-summary=html

    - name: Upload Matplotlib Test Failure Artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: matplotlib-test-failures
        path: pytest-mpl-results/
